name: Cinemana CP456 Dependency Bundle

on:
  push:
    branches: [cinemana-deps-cp456]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Create resolver project
        shell: bash
        run: |
          rm -rf /tmp/cinemana-deps
          mkdir -p /tmp/cinemana-deps
          cat > /tmp/cinemana-deps/settings.gradle <<'EOF'
          rootProject.name = 'cinemana-deps'
          EOF
          cat > /tmp/cinemana-deps/build.gradle <<'EOF'
          plugins { id 'base' }

          repositories {
              google()
              mavenCentral()
              maven { url 'https://zendesk.jfrog.io/zendesk/repo' }
              maven { url 'https://jitpack.io' }
          }

          configurations {
              runtimeBundle {
                  canBeConsumed = false
                  canBeResolved = true
                  transitive = true
              }
              pluginBundle {
                  canBeConsumed = false
                  canBeResolved = true
                  transitive = true
              }
          }

          dependencies {
              pluginBundle 'com.android.tools.build:gradle:8.1.1'
              pluginBundle 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'

              runtimeBundle 'javax.inject:javax.inject:1'
              runtimeBundle 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
              runtimeBundle 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
              runtimeBundle 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'

              runtimeBundle 'androidx.core:core-ktx:1.6.0'
              runtimeBundle 'androidx.appcompat:appcompat:1.3.1'
              runtimeBundle 'com.google.android.material:material:1.5.0'
              runtimeBundle 'androidx.constraintlayout:constraintlayout:2.1.4'
              runtimeBundle 'androidx.preference:preference-ktx:1.1.1'
              runtimeBundle 'androidx.recyclerview:recyclerview:1.2.1'
              runtimeBundle 'androidx.multidex:multidex:2.0.1'
              runtimeBundle 'androidx.fragment:fragment-ktx:1.3.0'
              runtimeBundle 'androidx.activity:activity-ktx:1.2.0'
              runtimeBundle 'androidx.databinding:databinding-runtime:8.1.1'
              runtimeBundle 'androidx.databinding:databinding-adapters:8.1.1'

              runtimeBundle 'androidx.camera:camera-core:1.0.0'
              runtimeBundle 'androidx.camera:camera-camera2:1.0.0'
              runtimeBundle 'androidx.camera:camera-lifecycle:1.0.0'
              runtimeBundle 'androidx.camera:camera-view:1.0.0-alpha24'

              runtimeBundle 'androidx.navigation:navigation-fragment-ktx:2.3.5'
              runtimeBundle 'androidx.navigation:navigation-ui-ktx:2.3.5'

              runtimeBundle 'androidx.room:room-runtime:2.6.1'
              runtimeBundle 'androidx.room:room-ktx:2.6.1'
              runtimeBundle 'androidx.room:room-rxjava2:2.6.1'
              runtimeBundle 'androidx.room:room-compiler:2.6.1'

              runtimeBundle 'androidx.lifecycle:lifecycle-livedata-ktx:2.3.1'
              runtimeBundle 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
              runtimeBundle 'androidx.lifecycle:lifecycle-process:2.6.1'
              runtimeBundle 'androidx.work:work-runtime-ktx:2.5.0'

              runtimeBundle 'com.google.android.exoplayer:exoplayer-core:2.15.1'
              runtimeBundle 'com.google.android.exoplayer:exoplayer-ui:2.15.1'

              runtimeBundle 'com.squareup.okhttp3:okhttp:4.9.2'
              runtimeBundle 'com.squareup.retrofit2:retrofit:2.9.0'
              runtimeBundle 'com.squareup.retrofit2:converter-gson:2.9.0'
              runtimeBundle 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
              runtimeBundle 'com.squareup.okhttp3:logging-interceptor:4.9.2'
              runtimeBundle 'com.google.code.gson:gson:2.8.8'
              runtimeBundle 'io.reactivex.rxjava2:rxjava:2.2.21'
              runtimeBundle 'io.reactivex.rxjava2:rxandroid:2.1.1'
              runtimeBundle 'org.greenrobot:eventbus:3.2.0'

              runtimeBundle 'com.github.bumptech.glide:glide:4.16.0'
              runtimeBundle 'com.github.bumptech.glide:compiler:4.16.0'
              runtimeBundle 'com.facebook.fresco:fresco:2.6.0'
              runtimeBundle 'com.facebook.android:facebook-login:8.1.0'
              runtimeBundle 'com.squareup.picasso:picasso:2.71828'

              runtimeBundle 'com.google.android.gms:play-services-cast-framework:19.0.0'
              runtimeBundle 'com.google.android.gms:play-services-auth:19.0.0'
              runtimeBundle 'com.google.firebase:firebase-crashlytics:18.2.1'
              runtimeBundle 'com.google.firebase:firebase-perf:20.0.2'
              runtimeBundle 'com.google.firebase:firebase-messaging:22.0.0'
              runtimeBundle 'com.google.android.gms:play-services-analytics:17.0.0'
              runtimeBundle 'com.google.android.gms:play-services-measurement:19.0.1'

              runtimeBundle 'com.google.android.flexbox:flexbox:3.0.0'
              runtimeBundle 'com.journeyapps:zxing-android-embedded:4.3.0'
              runtimeBundle 'com.google.mlkit:barcode-scanning:16.1.1'
              runtimeBundle 'com.google.android.gms:play-services-mlkit-barcode-scanning:16.1.4'
          }

          tasks.register('bundleDependencies') {
              doLast {
                  def out = file("$buildDir/cinemana-deps")
                  def runtime = new File(out, 'runtime')
                  def plugins = new File(out, 'plugins')
                  runtime.mkdirs(); plugins.mkdirs()
                  configurations.runtimeBundle.resolvedConfiguration.resolvedArtifacts.each { a ->
                      copy { from a.file; into runtime }
                  }
                  configurations.pluginBundle.resolvedConfiguration.resolvedArtifacts.each { a ->
                      copy { from a.file; into plugins }
                  }
                  file("$out/runtime-files.txt").text =
                      configurations.runtimeBundle.files.collect { it.name }.sort().join('\n') + '\n'
                  file("$out/plugin-files.txt").text =
                      configurations.pluginBundle.files.collect { it.name }.sort().join('\n') + '\n'
              }
          }
          EOF

      - name: Resolve dependencies
        working-directory: /tmp/cinemana-deps
        run: gradle --no-daemon --stacktrace bundleDependencies

      - name: Pack dependency bundle
        run: |
          cd /tmp/cinemana-deps/build
          zip -9 -r "$GITHUB_WORKSPACE/cinemana-cp456-dependencies.zip" cinemana-deps
          sha256sum "$GITHUB_WORKSPACE/cinemana-cp456-dependencies.zip" > "$GITHUB_WORKSPACE/cinemana-cp456-dependencies.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: cinemana-cp456-dependencies
          path: |
            cinemana-cp456-dependencies.zip
            cinemana-cp456-dependencies.zip.sha256
          retention-days: 7
