name: Cinemana Processor Dependency Cache

on:
  push:
    branches: [cinemana-deps-cp456]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-processors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Resolve processor graph
        shell: bash
        run: |
          rm -rf /tmp/cinemana-processors
          mkdir -p /tmp/cinemana-processors
          cat > /tmp/cinemana-processors/settings.gradle <<'EOF'
          rootProject.name = 'cinemana-processors'
          EOF
          cat > /tmp/cinemana-processors/build.gradle <<'EOF'
          import org.gradle.api.attributes.Usage
          import org.gradle.api.attributes.Category
          import org.gradle.api.attributes.LibraryElements
          import org.gradle.api.attributes.Bundling

          plugins { id 'base' }
          repositories { google(); mavenCentral() }

          configurations {
              processors {
                  canBeConsumed = false
                  canBeResolved = true
                  transitive = true
                  attributes {
                      attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
                      attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
                      attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
                      attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
                  }
              }
          }

          dependencies {
              processors 'androidx.room:room-compiler:2.6.1'
              processors 'com.github.bumptech.glide:compiler:4.16.0'
          }

          tasks.register('copyProcessors', Copy) {
              from configurations.processors
              into layout.buildDirectory.dir('processors')
          }
          EOF
          cd /tmp/cinemana-processors
          gradle --no-daemon --stacktrace copyProcessors
          cd build
          find processors -maxdepth 1 -type f -printf '%f\n' | sort > processor-files.txt
          zip -9 -r "$GITHUB_WORKSPACE/cinemana-processors.zip" processors processor-files.txt
          tar -C "$HOME/.gradle/caches" -czf "$GITHUB_WORKSPACE/cinemana-processors-modules2.tar.gz" modules-2
          sha256sum "$GITHUB_WORKSPACE/cinemana-processors.zip" "$GITHUB_WORKSPACE/cinemana-processors-modules2.tar.gz" > "$GITHUB_WORKSPACE/cinemana-processors.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cinemana-processor-cache
          path: |
            cinemana-processors.zip
            cinemana-processors-modules2.tar.gz
            cinemana-processors.sha256
          retention-days: 7
